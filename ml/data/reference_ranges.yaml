alp: {unit: U/L, default: {low: 44, high: 147}}
total_protein: {unit: g/dL, default: {low: 6.0, high: 8.3}}
albumin: {unit: g/dL, default: {low: 3.5, high: 5.2}}
globulin: {unit: g/dL, default: {low: 2.0, high: 3.5}}
ag_ratio: {unit: ratio, default: {low: 1.1, high: 2.5}}
