# Default reference ranges, used only when a report doesn't print its own
# range. Keyed by the canonical name in test_aliases.yaml. Each entry has a
# `default` low/high (used when patient sex is unknown, which is the normal
# case for parse_labs(ocr) -- it has no patient context) and, for the four
# tests called out in CLAUDE.md as differing meaningfully from Western
# defaults, sex-specific ICMR/NFI-aligned bounds kept alongside for callers
# that do have patient sex (e.g. a future V2.5 lab_flags.py).
hemoglobin: {unit: g/dL, default: {low: 12.0, high: 17.0}, male: {low: 13.0, high: 17.0}, female: {low: 12.0, high: 15.5}}
wbc_count: {unit: cells/cu mm, default: {low: 4000, high: 11000}}
platelet_count: {unit: lakhs/cu mm, default: {low: 1.50, high: 4.10}}
rbc_count: {unit: mill/cu mm, default: {low: 4.5, high: 5.5}}
pcv: {unit: "%", default: {low: 36, high: 50}}
mcv: {unit: fL, default: {low: 83, high: 101}}
mch: {unit: pg, default: {low: 27, high: 32}}
mchc: {unit: g/dL, default: {low: 31.5, high: 34.5}}
neutrophils: {unit: "%", default: {low: 40, high: 80}}
lymphocytes: {unit: "%", default: {low: 20, high: 40}}
eosinophils: {unit: "%", default: {low: 1, high: 6}}
basophils: {unit: "%", default: {low: 0, high: 2}}
monocytes: {unit: "%", default: {low: 2, high: 10}}
esr: {unit: mm/hr, default: {low: 0, high: 20}, male: {low: 0, high: 15}, female: {low: 0, high: 20}}
bilirubin_total: {unit: mg/dL, default: {low: 0.3, high: 1.2}}
bilirubin_direct: {unit: mg/dL, default: {low: 0.0, high: 0.3}}
bilirubin_indirect: {unit: mg/dL, default: {low: 0.2, high: 0.8}}
sgot_ast: {unit: U/L, default: {low: 5, high: 40}}
