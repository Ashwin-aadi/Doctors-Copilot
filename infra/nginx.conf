gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every asset filename with a content hash, so a given URL
    # can never change meaning -- a new build produces a new name. That makes the
    # response immutable and safe to keep for a year; the browser then re-fetches
    # nothing but index.html across deploys.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The entry point is the one file whose name is stable, so it is also the one
    # file that must never be cached: a stale index.html points at asset hashes
    # that no longer exist and the app loads to a blank screen.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Building a clinical brief is a retrieval pass plus a completion; the
        # 60s default cuts it off mid-generation on a cold index.
        proxy_read_timeout 180s;
        # The patient chat streams tokens, so nothing may sit in a proxy buffer.
        proxy_buffering off;
        # Responses carry patient data. They must never be stored by a shared
        # cache, and gzip over a compressed TLS stream is a known leak, so keep
        # the API out of the gzip filter above.
        gzip off;
        add_header Cache-Control "no-store" always;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Served outside /api, so without this it would fall through to the SPA and
    # answer every probe with index.html and a cheerful 200.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
