server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Building a clinical brief is a retrieval pass plus a completion; the
        # 60s default cuts it off mid-generation on a cold index.
        proxy_read_timeout 180s;
        # The patient chat streams tokens, so nothing may sit in a proxy buffer.
        proxy_buffering off;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Served outside /api/, so without this it would fall through to the SPA and
    # answer every probe with index.html and a cheerful 200.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }
}
