# A distinct project name: the dev stack in docker-compose.yml defaults to the
# directory name ("infra"), and sharing it would make an up here adopt and
# replace the running dev containers.
name: doctors-copilot-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot} -d ${POSTGRES_DB:-copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-copilot123}
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
      target: prod
    restart: unless-stopped
    # Order matters: prod.env overrides the localhost hosts in .env with the
    # compose service names. Secrets (GROQ_API_KEY, SECRET_KEY) come from .env.
    env_file:
      - ../.env
      - prod.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - storage:/app/infra/storage
      # The retrieval index and the model weights are large and slow to rebuild.
      # Bind them so a rebuilt image reuses whatever the host already has, and
      # falls back to ingesting/downloading when the host has nothing.
      - ../backend/infra/chroma:/app/backend/infra/chroma
      - ../ml/.cache:/app/ml/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  frontend:
    build:
      # Repository root, so the image can copy both frontend/ and infra/nginx.conf.
      context: ..
      dockerfile: infra/Dockerfile.frontend
      target: prod
      args:
        # Empty on purpose: the browser calls /api on its own origin and nginx
        # proxies it to the backend.
        VITE_API_BASE: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-80}:80"

volumes:
  pgdata:
  neo4jdata:
  storage:
