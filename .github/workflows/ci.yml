name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The triage tests exercise real TriageSession persistence rather than mocking
    # the session store, so the job needs a live database. Credentials and port
    # match the DATABASE_URL default in app/core/config.py.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Document upload enqueues the OCR job via RQ, which needs a live broker.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot

    steps:
      - uses: actions/checkout@v4
      # The ML stack (paddlepaddle, transformers, spacy, scispacy) is large
      # enough that the runner's default free space isn't reliable headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Caches the fully-installed venv (not just pip's download cache), so
      # a run with an unchanged requirements.txt restores in seconds instead
      # of re-installing torch/paddlepaddle/transformers/opencv from scratch.
      - uses: actions/cache@v4
        id: venv-cache
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('backend/requirements.txt') }}
      - name: Install dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check .
      - run: alembic upgrade head
      # tests/ml/test_documents_api.py authenticates as a seeded doctor user
      # via app/core/deps.py's placeholder token resolution.
      - run: python ../scripts/seed.py
      # security RBAC tests authenticate as fixed admin/staff seed users that
      # only scripts/seed_users.py creates.
      - run: python ../scripts/seed_users.py
      # ml/data/interactions.db is a generated artifact (gitignored, see
      # app/ml/kb_build.py docstring); tests/ml/test_safety.py needs it.
      # rxcui_lookup.csv/india_brands.csv are committed as an RxNav-lookup
      # cache, so this rebuild only hits the network for anything new.
      - run: python -m app.ml.kb_build
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test -- --run
      - run: npm run build
