# Public reference pages ingested into the "clinical" collection, used to
# ground the doctor-facing clinical copilot brief.
#
# India-first, per the same priority order as guideline_sources.yaml:
#   1. ICMR Standard Treatment Guidelines / AMR guidance, MoHFW/NHM programme
#      material, NCVBDC vector-borne protocols, NTEP TB guidance, NLEM 2022,
#      CDSCO public drug information                                -> region: IN
#   2. WHO India-relevant clinical material, international drug labels and
#      pharmacology references (openFDA/RxNorm are fetched separately, not
#      listed here) as supporting pharmacology, never as the primary voice
#      of a treatment recommendation                                -> region: INTL
#
# ingest_clinical.py skips any URL that fails at fetch time and tops up from
# the bundled clinical_seed.jsonl, so a dead link never empties the corpus.
sources:
