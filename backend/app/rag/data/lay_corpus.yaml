# Plain-language health explanations for the patient chatbot.
#
# Written in-house at roughly an 8th-standard English reading level for an
# Indian patient. Every entry is educational, never prescriptive: none of them
# tells a patient to start, stop or change a medicine. Loaded into the "lay"
# collection by app/rag/ingest_patient.py and retrieved alongside the patient's
# own records. The "clinical" collection is never exposed to a patient.
#
# MedlinePlus pages under `sources` are fetched when the network is reachable;
# these bundled entries are the offline fallback, so the lay collection is
# never empty.

