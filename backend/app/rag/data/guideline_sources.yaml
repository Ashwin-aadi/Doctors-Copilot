# Public reference pages ingested into the "guidelines" collection, used to ground
# pre-assessment triage.
#
# The list is India-first, in the priority order the product commits to:
#   1. Indian government / programme material (MoHFW, NCVBDC, NTEP, NCDC, ICMR, NHM)
#      and WHO India country pages                                    -> region: IN
#   2. WHO fact sheets for the communicable and tropical disease burden that
#      dominates Indian OPD and casualty presentations                -> region: INTL
#   3. MedlinePlus plain-language pages for the general symptom set    -> region: INTL
#
# Everything here is freely public reference material; no credential or paid API is
# required. ingest_guidelines.py skips any URL that fails at ingest time and tops up
# from the bundled offline symptom corpus, so a dead link never empties the corpus.
sources:
