# Emergency red-flag phrases and the referral-ladder floor each implies.
# `min_facility_type` is the lowest facility rung (phc < chc < sdh < dh <
# medical_college, same rank table as optimizer.yaml) that can actually
# manage the condition -- used to decide whether the assigned clinic needs a
# transfer suggestion. `phrase` is matched case-insensitively as a substring
# against the escalation reason / triage red flags (deterministic, no LLM).
#
# Sources: MoHFW/NELS emergency triage categories, NRHM First Referral Unit
# (FRU) criteria for obstetric emergencies, NTEP for haemoptysis, NPCDCS for
# DKA, NVBDCP/state snakebite protocols.
red_flags:
  - {phrase: "chest pain with sweating", category: acs, min_facility_type: chc}
  - {phrase: "crushing chest pain", category: acs, min_facility_type: chc}
  - {phrase: "chest pain radiating to arm", category: acs, min_facility_type: chc}
  - {phrase: "chest pain radiating to jaw", category: acs, min_facility_type: chc}
  - {phrase: "facial droop", category: stroke_fast, min_facility_type: dh}
