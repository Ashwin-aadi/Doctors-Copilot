# Facility-rank table, mirrored from optimizer.yaml so this pack is
# self-contained (escalation.py doesn't need to import optimizer.py's module
# constant for a rank lookup).
facility_rank: {phc: 0, chc: 1, sdh: 2, dh: 3, medical_college: 4}
