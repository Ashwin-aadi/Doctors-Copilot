# Gazetted national holidays (Republic Day, Holi, Independence Day, Gandhi
# Jayanti). Non-emergency-capable PHC/CHC facilities close on these dates and
# every Sunday; emergency-capable facilities run 24x7 regardless.
holidays: ["2026-01-26", "2026-03-04", "2026-08-15", "2026-10-02"]

# Minimum gap slots.py enforces between a doctor's sessions at two different
# clinics on the same day, so a slot never gets offered at a wall-clock time
# the doctor cannot physically reach the clinic by.
inter_clinic_travel_minutes: 30

# N1.4 priority-queue keys.
aging_minutes: 45          # after this wait, effective severity improves by 1 tier
aging_max_bonus: 2
avg_consult_minutes: 6     # Indian OPD reality: 4-8 min per patient, not 12
emergency_severity_max: 2  # RED tiers
grace_minutes: 15
token_prefix_by_facility: {phc: "P", chc: "C", sdh: "S", dh: "D", private_clinic: "K", private_hospital: "H"}
opd_sessions_ist: [{start: "09:00", end: "13:00"}, {start: "17:00", end: "20:00"}]
