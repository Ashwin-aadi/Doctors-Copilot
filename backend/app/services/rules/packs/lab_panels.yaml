# Lab-order recommendation rules, weighted to India's actual OPD disease
# burden (MoHFW Standard Treatment Guidelines, NTEP, NPCDCS, NVBDCP/NCVBDC,
# NLEM 2022, MoHFW ANC guidelines). Each rule is `when` (match predicate) +
# `specialty` (which requesting specialties this rule applies under) + `labs`
# (deduped, unioned across every matching rule) + optional `cghs_code` /
# `pmjay_package` for coverage display.
#
# `when` keys, all optional, all AND-ed together (an omitted key always
# passes): symptoms_any, symptoms_all, conditions_any, severity_max, season
# (list), region (list of state names), age_max, pregnant.
#
# `fallback: true` marks the one rule (`general_baseline`) used only when no
# other rule matches at all -- never unioned in alongside a real match.

- id: acute_febrile_illness_monsoon
  when: {symptoms_any: [fever, chills, "body ache", headache, myalgia], severity_max: 3, season: [monsoon]}
  specialty: [general_medicine, emergency_medicine, paediatrics, family_medicine]
  labs:
    - {name: "CBC with platelet count", loinc: "58410-2", reason: "Dengue - platelet trend"}
    - {name: "Dengue NS1 antigen", loinc: "75695-3", reason: "Early dengue detection"}
    - {name: "Malaria rapid test (Pf/Pv)", loinc: "70563-9", reason: "Rule out malaria"}
    - {name: "Widal / TyphiDot", loinc: "22590-1", reason: "Enteric fever screen"}
  cghs_code: "CG-PATH-014"
  pmjay_package: null

